name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (CPU-only PyTorch; no GPU on hosted runners)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"
      - name: Reference, contract, provider-fixture and state-machine tests
        # GPU tests are skipped on this runner and reported as skipped (-rs), never as passed.
        run: python -m pytest -rs
      - name: CPU reference checks
        run: python -m kernelforge test-reference --device cpu
      - name: Empty report renders
        run: |
          python -m kernelforge report --output site/index.html
          grep -q "No GPU measurements yet" site/index.html
